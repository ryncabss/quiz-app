<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Style Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .quiz-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 2px solid #ddd;
            text-align: center;
        }
        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        .question {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .answer-btn {
            background-color: #f1f1f1;
            border: none;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .answer-btn:hover {
            background-color: #e0e0e0;
        }
        .answer-btn.correct {
            background-color: #28a745;
            color: white;
        }
        .answer-btn.wrong {
            background-color: #dc3545;
            color: white;
        }
        .button-container {
            margin-top: 20px;
        }
        .finish-btn, .restart-btn, .next-btn, .back-btn, .start-btn, .solution-btn {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin: 5px;
        }
        .finish-btn:hover, .restart-btn:hover, .next-btn:hover, .back-btn:hover, .start-btn:hover, .solution-btn:hover {
            background-color: #0056b3;
        }
        .solution {
            display: none;
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 2px solid #ccc;
        }
        .solution p {
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h2>Quiz Question</h2>
        <div class="question-container">
            <!-- Question and options will be loaded here -->
        </div>

        <div class="solution">
            <strong>Solution:</strong>
            <p></p>
        </div>

        <div class="button-container">
            <button class="start-btn" onclick="startQuiz()">Start</button>
            <button class="finish-btn" onclick="finishQuiz()" style="display:none">Finish</button>
            <button class="restart-btn" onclick="restartQuiz()" style="display:none">Restart</button>
            <button class="next-btn" onclick="nextQuestion()" style="display:none">Next</button>
            <button class="back-btn" onclick="previousQuestion()" style="display:none">Back</button>
            <button class="solution-btn" onclick="showSolution()" style="display:none">Solution</button>
        </div>
    </div>

    <script src="quiz-data.js"></script>
    <script src="quiz-functions.js"></script>
    <script>
        let currentQuestionIndex = -1; // Track the current question index, start at -1
        let quizStarted = false; // Track whether the quiz has started

        // Function to start the quiz
        function startQuiz() {
            quizStarted = true;
            currentQuestionIndex = 0; // Set to the first question
            document.querySelector('.start-btn').style.display = 'none'; // Hide the start button
            loadQuestion(currentQuestionIndex);
            document.querySelector('.next-btn').style.display = 'inline-block';
            document.querySelector('.solution-btn').style.display = 'inline-block';
            document.querySelector('.back-btn').style.display = 'inline-block';
        }

        // Function to load the current question
        function loadQuestion(currentQuestionIndex) {
            if (currentQuestionIndex < 0 || currentQuestionIndex >= quizData.length) return;

            const questionContainer = document.querySelector('.question-container');
            const solutionContainer = document.querySelector('.solution p');
            const questionData = quizData[currentQuestionIndex];

            // Display question and options dynamically
            questionContainer.innerHTML = `
                <p class="question">${questionData.question}</p>
                ${questionData.options.map((option) => `
                    <button class="answer-btn" onclick="checkAnswer(this, '${option.answer.charAt(0)}')">${option.answer}</button>
                `).join('')}
            `;

            // Display solution text, but keep hidden until requested
            solutionContainer.innerHTML = questionData.solution;
            document.querySelector('.solution').style.display = 'none'; // Hide solution initially

            // Show Finish button on the last question
            if (currentQuestionIndex === quizData.length - 1) {
                document.querySelector('.finish-btn').style.display = 'inline-block';
                document.querySelector('.next-btn').style.display = 'none';
            } else {
                document.querySelector('.finish-btn').style.display = 'none';
                document.querySelector('.next-btn').style.display = 'inline-block';
            }
        }

        // Function to check the selected answer
        function checkAnswer(button, selectedAnswer) {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => {
                btn.disabled = true; // Disable all buttons after answering
            });

            const correctAnswer = quizData[currentQuestionIndex].options.find(option => option.correct);
            button.classList.add(selectedAnswer === correctAnswer.answer.charAt(0) ? 'correct' : 'wrong');
            
            if (selectedAnswer !== correctAnswer.answer.charAt(0)) {
                document.querySelector(`.answer-btn.${correctAnswer.answer.charAt(0)}`).classList.add('correct'); // Highlight the correct answer
            }

            // Show the solution
            document.querySelector('.solution').style.display = 'block';
        }

        // Function to show the solution
        function showSolution() {
            document.querySelector('.solution').style.display = 'block';
        }

        // Function to go to the next question
        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            }
        }

        // Function to go to the previous question
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
            }
        }

        // Finish the quiz
        function finishQuiz() {
            alert('You have finished the quiz!');
            restartQuiz();
        }

        // Restart the quiz
        function restartQuiz() {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => {
                btn.disabled = false; // Enable buttons again
                btn.classList.remove('correct', 'wrong');
            });

            // Hide the solution and reset UI
            document.querySelector('.solution').style.display = 'none';

            // Shuffle questions for a new session
            quizData.sort(() => Math.random() - 0.5); // Shuffle questions

            currentQuestionIndex = 0; // Reset to first question
            loadQuestion(currentQuestionIndex); // Load the first question
            document.querySelector('.start-btn').style.display = 'none'; // Hide the start button after restart
            document.querySelector('.finish-btn').style.display = 'none'; // Hide the finish button
            document.querySelector('.next-btn').style.display = 'inline-block'; // Show the next button
        }
    </script>
</body>
</html>
