<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Quiz App</title></head>
<body>
<div id="quiz-container" style="font-family: Arial; max-width: 500px; margin: auto;">
  <h3 id="question-number"></h3>
  <p id="question-text"></p>
  <div id="choices"></div>
  <p id="answer" style="font-weight: bold;"></p>
  <button id="solutionBtn" onclick="toggleSolution()" style="display: none; margin-top: 10px;">Show Solution</button>
  <div id="solution" style="display: none; border: 1px solid #ccc; padding: 10px; margin-top: 10px; background-color: #f9f9f9;"></div>
  <div style="margin-top: 20px;">
    <button onclick="prevQuestion()" id="prevBtn" style="display: none;">← Back</button>
    <button onclick="nextQuestion()" id="nextBtn">Next →</button>
    <button onclick="restartQuiz()" id="restartBtn" style="display: none;">Restart</button>
  </div>
</div>
<script src="quiz-data.js"></script>
<script src="quiz-functions.js"></script>
</body>
</html>
