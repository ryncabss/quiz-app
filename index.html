<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <style>
    /* General body styling */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9; /* Soft background color */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Quiz container with modern style */
    #quiz-container {
      background-color: #fff;
      border-radius: 15px; /* Rounded corners */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 100%;
      max-width: 500px;
      border: 2px solid #4CAF50; /* Green border for the quiz frame */
      transition: all 0.3s ease-in-out; /* Smooth transition for interactions */
    }

    /* Quiz question number */
    #question-number {
      font-size: 20px;
      color: #333;
      margin-bottom: 10px;
    }

    /* Quiz question text */
    #question-text {
      font-size: 22px;
      font-weight: 500;
      color: #555;
      margin-bottom: 20px;
    }

    /* Answer options styling */
    #choices {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .choice-btn {
      background-color: #007bff; /* Blue color for buttons */
      color: white;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      text-align: center;
      transition: background-color 0.3s;
    }

    .choice-btn:hover {
      background-color: #0056b3; /* Darker blue on hover */
    }

    /* Answer text style */
    #answer {
      font-weight: bold;
      color: #e74c3c; /* Red color for incorrect answers */
      margin-top: 10px;
    }

    /* Solution button and solution text */
    #solutionBtn {
      background-color: #e67e22; /* Orange color for solution button */
      color: white;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: none;
      margin-top: 15px;
      transition: background-color 0.3s;
    }

    #solutionBtn:hover {
      background-color: #d35400; /* Darker orange on hover */
    }

    /* Solution text box styling */
    #solution {
      display: none;
      border: 1px solid #ccc;
      padding: 15px;
      background-color: #f9f9f9;
      margin-top: 15px;
      border-radius: 8px;
    }

    /* Navigation buttons styling */
    .nav-btn {
      background-color: #4CAF50; /* Green color for navigation buttons */
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      transition: background-color 0.3s;
    }

    .nav-btn:hover {
      background-color: #388e3c; /* Darker green on hover */
    }

    #prevBtn {
      margin-right: 10px;
    }

    /* Responsive design for mobile */
    @media screen and (max-width: 600px) {
      #quiz-container {
        padding: 20px;
      }

      #question-number {
        font-size: 18px;
      }

      #question-text {
        font-size: 18px;
      }

      .choice-btn {
        font-size: 14px;
      }

      .nav-btn {
        font-size: 14px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <h3 id="question-number">Question 1</h3>
    <p id="question-text">What is the capital of France?</p>
    <div id="choices">
      <button class="choice-btn" onclick="checkAnswer(0)">Berlin</button>
      <button class="choice-btn" onclick="checkAnswer(1)">Madrid</button>
      <button class="choice-btn" onclick="checkAnswer(2)">Paris</button>
      <button class="choice-btn" onclick="checkAnswer(3)">Rome</button>
    </div>
    <p id="answer"></p>
    <button id="solutionBtn" onclick="toggleSolution()">Show Solution</button>
    <div id="solution">Paris is the capital of France.</div>
    <button onclick="prevQuestion()" id="prevBtn" class="nav-btn" style="display: none;">← Back</button>
    <button onclick="nextQuestion()" id="nextBtn" class="nav-btn">Next →</button>
    <button onclick="restartQuiz()" id="restartBtn" class="nav-btn" style="display: none;">Restart</button>
  </div>

  <script>
    let currentQuestionIndex = 0;
    const questions = [
      {
        question: "What is the capital of France?",
        choices: ["Berlin", "Madrid", "Paris", "Rome"],
        correctAnswer: 2,
        solution: "Paris is the capital of France."
      },
      // More questions can be added here
    ];

    function displayQuestion() {
      const question = questions[currentQuestionIndex];
      document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1}`;
      document.getElementById('question-text').textContent = question.question;
      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = ''; // Clear previous choices
      question.choices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.classList.add('choice-btn');
        button.textContent = choice;
        button.onclick = () => checkAnswer(index);
        choicesContainer.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex) {
      const question = questions[currentQuestionIndex];
      const answerText = document.getElementById('answer');
      if (selectedIndex === question.correctAnswer) {
        answerText.textContent = 'Correct!';
        answerText.style.color = '#2ecc71'; // Green for correct answers
      } else {
        answerText.textContent = `Incorrect! The correct answer is: ${question.choices[question.correctAnswer]}`;
        answerText.style.color = '#e74c3c'; // Red for incorrect answers
      }
      document.getElementById('solution').textContent = question.solution;
      document.getElementById('solutionBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function toggleSolution() {
      const solution = document.getElementById('solution');
      solution.style.display = solution.style.display === 'none' ? 'block' : 'none';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        displayQuestion();
        document.getElementById('answer').textContent = '';
        document.getElementById('solution').style.display = 'none';
        document.getElementById('solutionBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
      } else {
        alert('You have completed the quiz!');
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        displayQuestion();
        document.getElementById('answer').textContent = '';
        document.getElementById('solution').style.display = 'none';
        document.getElementById('solutionBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      displayQuestion();
      document.getElementById('answer').textContent = '';
      document.getElementById('solution').style.display = 'none';
      document.getElementById('solutionBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('prevBtn').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      displayQuestion();
    });
  </script>

</body>
</html>
