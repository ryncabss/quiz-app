<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <style>
    /* General body styling */
    body {
      font-family: 'Poppins', sans-serif; /* Stylish modern font */
      margin: 0;
      padding: 0;
      background-color: #f5f7fb; /* Soft background color */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Quiz container with modern style */
    #quiz-container {
      background-color: #ffffff;
      border-radius: 20px; /* Smooth rounded corners */
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1); /* Subtle shadow */
      padding: 40px;
      width: 100%;
      max-width: 600px;
      border: 3px solid #4e73df; /* Blue border for the quiz frame */
      transition: all 0.3s ease-in-out; /* Smooth transition */
    }

    /* Quiz question number */
    #question-number {
      font-size: 22px;
      font-weight: 600;
      color: #4e73df; /* Vibrant blue */
      margin-bottom: 15px;
    }

    /* Quiz question text */
    #question-text {
      font-size: 24px;
      font-weight: 500;
      color: #333;
      margin-bottom: 25px;
    }

    /* Answer options styling */
    #choices {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .choice-btn {
      background: linear-gradient(45deg, #6a11cb, #2575fc); /* Gradient background */
      color: white;
      padding: 15px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 18px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .choice-btn:hover {
      transform: translateY(-5px); /* Slight lift on hover */
      background: linear-gradient(45deg, #2575fc, #6a11cb); /* Reverse gradient */
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15); /* Stronger shadow */
    }

    /* Answer text style */
    #answer {
      font-weight: bold;
      margin-top: 15px;
      font-size: 18px;
    }

    /* Correct and incorrect answer styles */
    .correct {
      color: #28a745; /* Green for correct */
    }

    .incorrect {
      color: #dc3545; /* Red for incorrect */
    }

    /* Solution button and solution text */
    #solutionBtn {
      background-color: #f39c12; /* Bright orange */
      color: white;
      padding: 12px 25px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
    }

    #solutionBtn:hover {
      background-color: #e67e22; /* Darker orange */
      transform: scale(1.05); /* Slight scale effect */
    }

    /* Solution text box styling */
    #solution {
      display: none;
      border: 1px solid #ddd;
      padding: 18px;
      background-color: #f9f9f9;
      margin-top: 20px;
      border-radius: 10px;
      font-size: 16px;
      color: #555;
    }

    /* Navigation buttons styling */
    .nav-btn {
      background-color: #4e73df; /* Blue for navigation buttons */
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 18px;
      margin-top: 25px;
      transition: background-color 0.3s ease;
    }

    .nav-btn:hover {
      background-color: #2e59d9; /* Darker blue on hover */
      transform: scale(1.05);
    }

    #prevBtn {
      margin-right: 20px;
    }

    /* Responsive design for mobile */
    @media screen and (max-width: 600px) {
      #quiz-container {
        padding: 25px;
      }

      #question-number {
        font-size: 18px;
      }

      #question-text {
        font-size: 20px;
      }

      .choice-btn {
        font-size: 16px;
        padding: 14px;
      }

      .nav-btn {
        font-size: 16px;
        padding: 10px 18px;
      }
    }
  </style>
</head>
<body>

  <div id="quiz-container">
    <h3 id="question-number">Question 1</h3>
    <p id="question-text">What is the capital of France?</p>
    <div id="choices">
      <button class="choice-btn" onclick="checkAnswer(0)">Berlin</button>
      <button class="choice-btn" onclick="checkAnswer(1)">Madrid</button>
      <button class="choice-btn" onclick="checkAnswer(2)">Paris</button>
      <button class="choice-btn" onclick="checkAnswer(3)">Rome</button>
    </div>
    <p id="answer"></p>
    <button id="solutionBtn" onclick="toggleSolution()">Show Solution</button>
    <div id="solution">Paris is the capital of France.</div>
    <button onclick="prevQuestion()" id="prevBtn" class="nav-btn" style="display: none;">← Back</button>
    <button onclick="nextQuestion()" id="nextBtn" class="nav-btn">Next →</button>
    <button onclick="restartQuiz()" id="restartBtn" class="nav-btn" style="display: none;">Restart</button>
  </div>

  <script>
    let currentQuestionIndex = 0;
    const questions = [
      {
        question: "What is the capital of France?",
        choices: ["Berlin", "Madrid", "Paris", "Rome"],
        correctAnswer: 2,
        solution: "Paris is the capital of France."
      },
      // Additional questions can go here
    ];

    function displayQuestion() {
      const question = questions[currentQuestionIndex];
      document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1}`;
      document.getElementById('question-text').textContent = question.question;
      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = ''; // Clear previous choices
      question.choices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.classList.add('choice-btn');
        button.textContent = choice;
        button.onclick = () => checkAnswer(index);
        choicesContainer.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex) {
      const question = questions[currentQuestionIndex];
      const answerText = document.getElementById('answer');
      if (selectedIndex === question.correctAnswer) {
        answerText.textContent = 'Correct!';
        answerText.classList.add('correct');
        answerText.classList.remove('incorrect');
      } else {
        answerText.textContent = `Incorrect! The correct answer is: ${question.choices[question.correctAnswer]}`;
        answerText.classList.add('incorrect');
        answerText.classList.remove('correct');
      }
      document.getElementById('solution').textContent = question.solution;
      document.getElementById('solutionBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function toggleSolution() {
      const solution = document.getElementById('solution');
      solution.style.display = solution.style.display === 'none' ? 'block' : 'none';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        displayQuestion();
        document.getElementById('answer').textContent = '';
        document.getElementById('solution').style.display = 'none';
        document.getElementById('solutionBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
      } else {
        alert('You have completed the quiz!');
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        displayQuestion();
        document.getElementById('answer').textContent = '';
        document.getElementById('solution').style.display = 'none';
        document.getElementById('solutionBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      displayQuestion();
      document.getElementById('answer').textContent = '';
      document.getElementById('solution').style.display = 'none';
      document.getElementById('solutionBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('prevBtn').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      displayQuestion();
    });
  </script>

</body>
</html>
