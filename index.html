<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz App</title>
  <style>
    /* General body styling */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* Prevent horizontal scrolling */
      position: relative; /* Allow absolute positioning of fireworks */
      height: 100vh; /* Ensure full viewport height */
    }

    /* Button styling for toggling the frame */
    #toggle-slide-btn {
      background-color: #E0AA3E; /* Buy Me A Coffee color */
      color: white;
      padding: 15px 30px; /* Larger padding */
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: fixed;
      right: 20px; /* Keep the button at the bottom-right */
      bottom: 20px;
      z-index: 1001; /* Make sure the button is on top */
      font-size: 18px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4); /* Slight shadow for depth */
      transition: all 0.3s ease;
      border-radius: 12px; /* Rounded corners */
      background-clip: padding-box; /* Prevent background from covering the border */
      padding: 20px 40px; /* Larger button size */
    }

    /* Rainbow border animation */
    #toggle-slide-btn {
      border: 4px solid transparent;
      background-clip: padding-box;
      animation: rainbow-border 5s linear infinite;
    }

    @keyframes rainbow-border {
      0% {
        border-color: red;
      }
      14% {
        border-color: orange;
      }
      28% {
        border-color: yellow;
      }
      42% {
        border-color: green;
      }
      57% {
        border-color: blue;
      }
      71% {
        border-color: indigo;
      }
      85% {
        border-color: violet;
      }
      100% {
        border-color: red;
      }
    }

    /* Button hover effect */
    #toggle-slide-btn:hover {
      background-color: #FFD700; /* Slightly darker gold on hover */
    }

    /* Frame that will slide in from the right */
    #sliding-frame {
      position: fixed;
      right: -250px; /* Initially hidden off-screen to the right */
      bottom: 70px; /* Positioned above the button */
      width: 200px; /* Smaller frame width */
      height: 150px; /* Smaller frame height */
      background-color: #f9f9f9;
      border: 3px solid #4CAF50;
      padding: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      transition: right 0.5s ease-in-out; /* Smooth slide-in transition */
      z-index: 1000; /* Ensure it's above other content */
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    /* Styling for the buttons inside the frame (smaller) */
    .frame-btn {
      background-color: #4CAF50;
      color: white;
      padding: 8px 16px; /* Smaller button */
      border: none;
      border-radius: 5px;
      text-decoration: none; /* Remove underline from links */
      text-align: center;
      width: 100%;
      display: block;
      margin-top: 10px;
    }

    .frame-btn:hover {
      background-color: #45a049;
    }

    /* Specific colors for buttons */
    .buy-coffee-btn {
      background-color: #E0AA3E; /* Buy me a coffee color */
    }

    .gcash-btn {
      background-color: #0061F2; /* Gcash color */
    }

    /* Fireworks effect */
    .fireworks {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 10000;
      pointer-events: none;
    }
    .fireworks .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #fff;
      border-radius: 50%;
      animation: bounce-spark 1.5s infinite;
    }

    /* Spark Bouncing Animation */
    @keyframes bounce-spark {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      25% { opacity: 0.8; transform: translateY(-50px) scale(1.2); }
      50% { opacity: 0.6; transform: translateY(0) scale(1.5); }
      75% { opacity: 0.8; transform: translateY(50px) scale(1.2); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Fireworks burst animation */
    .burst {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: burst-animation 1s forwards;
    }

    @keyframes burst-animation {
      0% {
        opacity: 1;
        transform: scale(0);
      }
      50% {
        opacity: 0.8;
        transform: scale(3);
      }
      100% {
        opacity: 0;
        transform: scale(5);
      }
    }

    /* Large "THANK YOU SO MUCH" text */
    #thank-you-text {
      position: absolute;
      top: 30%; /* Adjust the vertical position */
      left: 50%;
      transform: translateX(-50%); /* Center horizontally */
      font-size: 60px; /* Large text */
      color: #E0AA3E; /* Orange-yellow color */
      font-weight: bold;
      text-align: center;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
      z-index: 5000; /* Ensure it's above the fireworks */
      opacity: 0; /* Initially hidden */
      transition: opacity 1s ease-out; /* Fade out smoothly */
      line-height: 1.5; /* Add spacing between lines */
      animation: bounce-text 1.5s infinite; /* Bounce animation */
    }

    /* Bouncing animation for "THANK YOU SO MUCH" */
    @keyframes bounce-text {
      0% {
        transform: translateY(0);
      }
      25% {
        transform: translateY(-30px);
      }
      50% {
        transform: translateY(0);
      }
      75% {
        transform: translateY(20px);
      }
      100% {
        transform: translateY(0);
      }
    }

  </style>
</head>

    <a href="https://buymeacoffee.com/mindcells" class="frame-btn buy-coffee-btn" target="_blank">Buy me a coffee</a>

  <button id="toggle-slide-btn" onclick="toggleSlidingFrame()">Buy Me A Coffee</button>

  <!-- Fireworks container -->
